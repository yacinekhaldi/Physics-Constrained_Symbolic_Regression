[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reliability-aware-symbolic-regression"
version = "0.1.0"
description = "Reliability-aware symbolic regression workflow for thermo-hydraulic correlation discovery."
readme = "README.md"
requires-python = ">=3.10,<3.15"
authors = [
  {name = "Yacine Khaldi", email = "khaldi.yacine@ens-ouargla.dz"},
  {name = "Hanane Azzaoui", email = "hanane.azzaoui@univ-ouargla.dz"},
  {name = "Mohamed Ben Bezziane", email = "benbezziane.mohamed@univ-ouargla.dz"},
  {name = "Amir Benzaoui", email = "a.benzaoui@univ-skikda.dz"}
]
dependencies = [
  "numpy>=1.26,<2.3",
  "pandas>=2.2,<2.4",
  "scipy>=1.11,<1.16",
  "scikit-learn>=1.4,<1.6",
  "matplotlib>=3.8,<3.11",
  "joblib>=1.3,<1.7",
  "openpyxl>=3.1,<3.2",
  "xgboost>=2.0,<4.0",
  "gplearn>=0.4.2,<0.5",
  "sympy>=1.12,<1.15"
]

[project.optional-dependencies]
pysr = ["pysr>=0.19"]

[tool.setuptools.packages.find]
where = ["src"]
